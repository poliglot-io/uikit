name: Sync docs to poliglot-io/kleo

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag whose docs to sync.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Open PR in kleo with refreshed UIKit docs
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout uikit at the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          path: uikit

      - name: Checkout kleo (develop)
        uses: actions/checkout@v4
        with:
          repository: poliglot-io/kleo
          ref: develop
          token: ${{ secrets.KLEO_DOCS_SYNC_TOKEN }}
          path: kleo

      - name: Replace kleo's UIKit docs with the tagged tree
        run: |
          set -euo pipefail
          target="kleo/kleo/frontend/content/docs/arch"
          mkdir -p "$target"
          cp uikit/docs/index.mdx          "$target/uikit.mdx"
          cp uikit/docs/ui-components.mdx  "$target/ui-components.mdx"

      - name: Check for changes
        id: diff
        working-directory: kleo
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open / update PR in kleo
        if: steps.diff.outputs.changed == 'true'
        working-directory: kleo
        env:
          GH_TOKEN: ${{ secrets.KLEO_DOCS_SYNC_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "poliglot-docs-bot"
          git config user.email "noreply@poliglot.io"
          branch="docs-sync/uikit-${TAG}"
          git checkout -B "$branch"
          git add kleo/frontend/content/docs/arch
          git commit -m "docs(uikit): sync from @poliglot-io/uikit ${TAG}"
          git push --force origin "$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR already open; force-push refreshed it."
          else
            gh pr create \
              --base develop \
              --head "$branch" \
              --title "docs(uikit): sync from @poliglot-io/uikit ${TAG}" \
              --body "Hand-authored UIKit docs from \`poliglot-io/uikit@${TAG}\`. Edit upstream in the uikit repo's \`docs/\`, then publish a new tag."
          fi
