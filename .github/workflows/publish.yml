name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing + provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish  # requires manual approval per environment policy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # OIDC trusted publishing requires npm >= 11.5.1; node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          REF_TAG="${GITHUB_REF#refs/tags/}"
          if [ -n "${{ inputs.tag }}" ]; then REF_TAG="${{ inputs.tag }}"; fi
          if [ "$PKG_VERSION" != "$REF_TAG" ]; then
            echo "Tag $REF_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Auth is via OIDC trusted publishing (no NPM_TOKEN); provenance is automatic.
      - name: Publish
        run: npm publish --provenance --access public
