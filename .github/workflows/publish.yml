name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing + provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish  # requires manual approval per environment policy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # OIDC trusted publishing requires npm >= 11.5.1; node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The tag is the single source of truth for the version: stamp package.json
      # from it at publish time. package.json keeps a 0.0.0-development placeholder
      # in git, so there is no per-release version-bump commit.
      - name: Stamp version from tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # Auth is via OIDC trusted publishing (no NPM_TOKEN); provenance is automatic.
      # Prereleases (e.g. 0.1.0-beta.8) go to the `next` dist-tag, never `latest`;
      # npm also requires an explicit --tag for prerelease versions.
      - name: Publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
          echo "Publishing $VERSION to dist-tag '$DIST_TAG'"
          npm publish --provenance --access public --tag "$DIST_TAG"
